[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent3"
version = "1.0.0"
description = "Agent3 - local autonomous AI coding agent & workspace desktop application (Ollama powered)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent3 Contributors" }]
keywords = ["ollama", "ai-agent", "coding-agent", "pyside6", "desktop", "ide"]

dependencies = [
    "PySide6-Essentials>=6.8,<6.12",
    "requests>=2.32",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "pyinstaller>=6.11"]

[project.scripts]
agent3 = "agent3.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["gui: tests that require a Qt platform plugin (run with QT_QPA_PLATFORM=offscreen)"]
